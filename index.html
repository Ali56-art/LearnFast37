<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFast-EBA-BK-PORTAL.COM</title>
    <style>
        :root {
            --primary: #4c51bf;
            --primary-dark: #434190;
            --accent: #ed8936;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 650px;
            transition: all 0.3s ease;
        }

        .dashboard-container { 
            max-width: 1200px !important; 
            width: 95vw !important;
        }

        h2, h3, h4 { color: #2d3748; margin-top: 0; }

        .portal-brand {
            font-size: 22px;
            font-weight: 800;
            color: #2b6cb0;
            letter-spacing: 0.5px;
            text-align: center;
            background: #edf2f7;
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid #cbd5e0;
            margin-bottom: 20px;
        }

        .sub-title {
            text-align: center;
            color: #718096;
            font-size: 15px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 6px; color: #4a5568; font-weight: 600; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border: 1px solid #cbd5e0;
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
        }

        .captcha-box {
            background: #f7fafc; border: 1px solid #e2e8f0;
            border-radius: 8px; padding: 12px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }

        .btn-submit {
            width: 100%; padding: 14px; background: var(--primary);
            border: none; border-radius: 8px; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--primary-dark); }

        .student-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: none; border-radius: 8px; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .hidden { display: none !important; }
        .divider { text-align: center; margin: 15px 0; color: #a0aec0; font-size: 13px; }

        .option-card {
            border: 2px solid #e2e8f0; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 10px; display: flex;
            align-items: center; gap: 12px; cursor: pointer; background: #f7fafc;
        }

        /* DASHBOARD */
        .welcome-header {
            background: #edf2f7; padding: 20px; border-radius: 12px;
            margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .ai-assistant-btn {
            background: linear-gradient(135deg, #38a169, #276749);
            color: white; border: none; padding: 10px 16px; border-radius: 8px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        .subject-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 25px;
        }

        .subject-card {
            background: white; border: 2px solid #e2e8f0; border-radius: 14px;
            padding: 25px 15px; text-align: center; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .subject-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2); }
        .subject-card.disabled-subject { background: #edf2f7; border-color: #cbd5e0; cursor: not-allowed; opacity: 0.4; transform: none !important; box-shadow: none !important; }

        .subject-icon { font-size: 42px; margin-bottom: 10px; }
        .subject-title { font-size: 18px; color: #2d3748; font-weight: bold; }
        
        .grade-badge { background: #e2e8f0; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #4a5568; }
